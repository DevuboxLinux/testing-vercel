<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Listing</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Ubuntu', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container-main {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-section {
            display: flex;
            gap: 30px;
            margin-bottom: 60px;
            align-items: flex-start;
        }

        .app-icon {
            width: 160px;
            height: 160px;
            background-color: #ffffff;
            border: 2px solid #333333;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: #333333;
        }

        .app-info {
            flex: 1;
            padding-top: 10px;
        }

        .app-name {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .app-meta {
            color: #b0b0b0;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .app-description {
            color: #e0e0e0;
            font-size: 15px;
            line-height: 1.6;
        }

        .install-btn {
            width: 160px;
            height: 50px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Ubuntu', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .install-btn:hover {
            background-color: #e0e0e0;
        }

        .install-btn:active {
            background-color: #ffffff;
        }

        .screenshots-section {
            margin-top: 40px;
        }

        .screenshots-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .screenshots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .screenshot-card {
            background-color: #1a1a1a;
            border: 2px solid #333333;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            overflow: hidden;
        }

        .screenshot-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 768px) {
            .header-section {
                flex-direction: column;
                gap: 20px;
                align-items: center;
                text-align: center;
            }

            .app-info {
                width: 100%;
            }

            .app-name {
                font-size: 28px;
            }

            .install-btn {
                width: 160px;
            }

            .screenshots-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container-main">
        <!-- Header Section -->
        <div class="header-section">
            <img src="gvisionv3.webp" alt="App Icon" class="app-icon">

            <div class="app-info">
                <h1 class="app-name">Gvision V3</h1>
                <div class="app-meta">
                    <div>Memerlukan Android: 7.0+ Nougat</div>
                </div>
                <p class="app-description">Gvision V3 buatan Bayu Stecu</p>
            </div>

                <a href="gvisionv3.apk" class="install-btn" role="button">Install</a>
        </div>

        <!-- Screenshots Section -->
        <div class="screenshots-section">
            <h2 class="screenshots-title">Screenshots</h2>
            <div class="screenshots-grid">
                <div class="screenshot-card">
                    <img src="https://placehold.co/360x640/1a1a1a/ffffff?text=Screenshot+1%0APortrait" alt="Screenshot 1 - Portrait">
                </div>

                <div class="screenshot-card">
                    <img src="https://placehold.co/640x360/1a1a1a/ffffff?text=Screenshot+2+-+Landscape" alt="Screenshot 2 - Landscape">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
